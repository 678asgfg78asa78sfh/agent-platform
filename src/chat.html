<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* deep refined slate */
  --bg-deep:#070809; --bg-base:#0b0d11; --bg-surface:#14171e; --bg-card:#181c25; --bg-input:#0e1116;
  /* cool semantic colors (NAMES kept — JS inline-styles reference them) */
  --blue:#5b9dff; --green:#37d49a; --red:#fb6f8a; --orange:#f7b23b; --purple:#a98bff; --cyan:#2bd4e0;
  --cyan-glow:rgba(43,212,224,0.22); --purple-glow:rgba(169,139,255,0.20);
  --text:#e8ebf2; --text-dim:#8a93a6; --text-bright:#fbfcff;
  --border:#242a36;
  /* warm signature accent (chrome/brand) */
  --accent:#f5b13d; --accent-2:#ff855c; --accent-soft:rgba(245,177,61,0.14); --accent-glow:rgba(245,177,61,0.32);
  --font:'JetBrains Mono','Cascadia Code',ui-monospace,monospace;
  --display:'Bricolage Grotesque','JetBrains Mono',system-ui,sans-serif;
  --radius:9px; --radius-lg:14px; --radius-xl:22px;
  --transition:0.22s cubic-bezier(.4,0,.2,1);
  --shadow:0 10px 30px -12px rgba(0,0,0,0.6);
  --glass:saturate(150%) blur(20px);
}
html, body { height:100%; background:var(--bg-deep); color:var(--text); font-family:var(--font); font-size:13.5px; line-height:1.55; overflow:hidden; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
/* atmosphere: layered radial glows, no more scanlines */
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(820px 520px at 88% -8%, rgba(245,177,61,0.10), transparent 60%),
    radial-gradient(900px 600px at -6% 4%, rgba(43,212,224,0.07), transparent 55%),
    radial-gradient(700px 700px at 50% 120%, rgba(169,139,255,0.06), transparent 60%);
}
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#2b3340; border-radius:99px; border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:#3a44545e; background-clip:content-box; }

#chat-app { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; }

/* ─── Topbar (glass) ─── */
.chat-topbar {
  display:flex; align-items:center; gap:7px; padding:0 14px; height:54px; min-height:54px;
  background:rgba(13,16,21,0.72); -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  border-bottom:1px solid var(--border); position:relative;
}
.chat-topbar::after {
  content:''; position:absolute; bottom:-1px; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity:0.5;
}
/* brand left */
.chat-topbar .agent-avatar {
  order:1; width:34px; height:34px; border-radius:11px; margin-right:4px;
  background:linear-gradient(140deg, var(--accent), var(--accent-2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--display); font-size:16px; font-weight:700; color:#1a1206;
  box-shadow:0 4px 16px -4px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.35);
}
.chat-topbar .agent-name { order:2; font-family:var(--display); font-size:16px; font-weight:700; color:var(--text-bright); letter-spacing:-0.2px; }
.chat-topbar .agent-sub { order:3; font-size:10.5px; color:var(--text-dim); margin-left:7px; padding:2px 7px; border:1px solid var(--border); border-radius:99px; }
.chat-topbar .status-dot { order:4; width:8px; height:8px; border-radius:50%; margin-left:9px; background:var(--green); box-shadow:0 0 0 3px rgba(55,212,154,0.16); animation:pulse 2.4s ease-in-out infinite; }
.chat-topbar .status-dot.error { background:var(--red); box-shadow:0 0 0 3px rgba(251,111,138,0.18); }
@keyframes pulse { 0%,100%{ box-shadow:0 0 0 3px rgba(55,212,154,0.16);} 50%{ box-shadow:0 0 0 6px rgba(55,212,154,0.04);} }
.chat-topbar .token-count { order:5; font-size:10.5px; color:var(--text-dim); margin-left:9px; }

/* tools right (icon buttons share .clear-btn) */
.clear-btn {
  font-family:var(--font); font-size:13px; background:rgba(255,255,255,0.025);
  border:1px solid var(--border); color:var(--text-dim);
  height:34px; min-width:34px; padding:0 9px; border-radius:10px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  transition:var(--transition);
}
.clear-btn:hover { color:var(--text-bright); border-color:#3a4453; background:rgba(255,255,255,0.06); transform:translateY(-1px); }
.chat-topbar > #media-btn { margin-left:auto; }
.chat-topbar #media-btn{order:11;} .chat-topbar #video-create-btn{order:12;} .chat-topbar #image-create-btn{order:13;}
.chat-topbar #planner-btn{order:14;} .chat-topbar #pipeline-btn{order:15;} .chat-topbar #convo-select{order:16;}
.chat-topbar #convo-new{order:17;} .chat-topbar #notification-btn{order:18;} .chat-topbar #files-btn{order:19;} .chat-topbar #clear-btn{order:20;}
#convo-select {
  background:var(--bg-input)!important; border:1px solid var(--border)!important; color:var(--text)!important;
  font-family:var(--font)!important; font-size:11px!important; height:34px; padding:0 10px!important;
  border-radius:10px!important; max-width:190px; cursor:pointer; outline:none;
}
#convo-select:hover { border-color:#3a4453!important; }
.notification-btn { position:relative; }
.notification-count {
  position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:linear-gradient(140deg,var(--accent-2),var(--red)); color:#fff;
  border:2px solid var(--bg-base); display:none; align-items:center; justify-content:center;
  font-size:9px; font-weight:700; line-height:13px;
}
.notification-count.visible { display:flex; }

/* ─── Panels (glass dropdowns) ─── */
.panel {
  display:none; border-bottom:1px solid var(--border);
  background:rgba(18,21,28,0.82); -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  max-height:300px; overflow-y:auto; font-size:11.5px; box-shadow:var(--shadow);
  animation:panelIn 0.28s cubic-bezier(.2,.8,.2,1);
}
@keyframes panelIn { from{ opacity:0; transform:translateY(-8px);} to{ opacity:1; transform:translateY(0);} }
.panel-head {
  position:sticky; top:0; display:flex; justify-content:space-between; align-items:center;
  padding:9px 14px; background:rgba(18,21,28,0.9); border-bottom:1px solid var(--border);
}
.panel-title { font-family:var(--display); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1.2px; color:var(--accent); }
.notification-list { padding:8px 10px; display:flex; flex-direction:column; gap:7px; }
.notification-empty { color:var(--text-dim); padding:10px; font-style:italic; }
.notification-item { border:1px solid var(--border); border-radius:11px; padding:9px 11px; background:rgba(255,255,255,0.02); transition:var(--transition); }
.notification-item:hover { border-color:#333c4a; }
.notification-item.unread { border-color:var(--accent-soft); background:var(--accent-soft); }
.notification-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
.notification-title { color:var(--text-bright); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.notification-time { color:var(--text-dim); font-size:9.5px; white-space:nowrap; }
.notification-body { color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; }
.notification-actions { display:flex; align-items:center; gap:6px; }

/* ─── Messages ─── */
.messages { flex:1; overflow-y:auto; padding:22px 18px 16px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; }
.msg { display:flex; gap:11px; max-width:78%; animation:msgIn 0.42s cubic-bezier(.2,.8,.2,1) both; }
@keyframes msgIn { from{ opacity:0; transform:translateY(12px) scale(.99);} to{ opacity:1; transform:translateY(0) scale(1);} }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg.assistant { align-self:flex-start; }
.msg .avatar {
  width:32px; height:32px; min-width:32px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--display); font-size:13px; font-weight:700; margin-top:18px;
}
.msg.user .avatar { background:linear-gradient(140deg, var(--accent), var(--accent-2)); color:#1a1206; box-shadow:0 4px 14px -5px var(--accent-glow); }
.msg.assistant .avatar { background:linear-gradient(140deg,#222936,#2c3647); color:var(--text-bright); border:1px solid #333c4a; }
.bubble { padding:11px 15px; border-radius:16px; line-height:1.62; word-wrap:break-word; font-size:13px; position:relative; }
.msg.user .bubble { background:linear-gradient(140deg, rgba(245,177,61,0.16), rgba(255,133,92,0.10)); border:1px solid rgba(245,177,61,0.28); color:var(--text-bright); white-space:pre-wrap; border-bottom-right-radius:5px; }
.msg.assistant .bubble { background:var(--bg-card); border:1px solid var(--border); box-shadow:var(--shadow); border-bottom-left-radius:5px; }
.bubble code { background:rgba(0,0,0,0.35); padding:2px 6px; border-radius:5px; font-size:12px; color:var(--accent); }
.bubble pre { background:#0a0c10; padding:12px 14px; border-radius:11px; overflow-x:auto; margin:8px 0; border:1px solid var(--border); }
.bubble pre code { background:none; padding:0; color:var(--text); }
.bubble strong { color:var(--text-bright); font-weight:700; } .bubble em { color:var(--text-dim); }
.bubble p { margin-bottom:6px; } .bubble p:last-child { margin-bottom:0; }
.bubble a { color:var(--cyan); }
.name { font-family:var(--display); font-size:11px; font-weight:600; letter-spacing:0.3px; margin:0 2px 5px; text-transform:uppercase; }
.msg.user .name { text-align:right; color:var(--accent); }
.msg.assistant .name { color:var(--text-dim); }
.typing-cursor { display:inline-block; width:7px; height:14px; background:var(--accent); border-radius:2px; margin-left:3px; vertical-align:middle; animation:cursorBlink 1s step-end infinite; }
@keyframes cursorBlink { 0%,100%{ opacity:1;} 50%{ opacity:0;} }

/* ─── Status / stats ─── */
.chat-status-bar {
  padding:7px 18px; font-size:11px; color:var(--accent);
  background:var(--accent-soft); border-top:1px solid rgba(245,177,61,0.14);
  display:none; align-items:center; gap:9px; flex-shrink:0;
}
.chat-status-bar.visible { display:flex; }
.chat-status-bar .spinner { width:13px; height:13px; border:2px solid rgba(245,177,61,0.25); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to{ transform:rotate(360deg);} }
.stats-bar { display:flex; gap:16px; padding:6px 18px; font-size:10px; color:var(--text-dim); background:rgba(7,8,9,0.6); border-top:1px solid rgba(255,255,255,0.03); flex-shrink:0; }
.stats-bar .sv { color:var(--green); font-weight:600; }

/* ─── Composer ─── */
.input-area { padding:14px 18px 18px; border-top:1px solid var(--border); background:rgba(13,16,21,0.7); -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); flex-shrink:0; }
.input-row { display:flex; gap:10px; align-items:flex-end; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-lg); padding:6px 6px 6px 6px; transition:var(--transition); box-shadow:0 6px 20px -14px rgba(0,0,0,0.7); }
.input-row:focus-within { border-color:rgba(245,177,61,0.55); box-shadow:0 0 0 4px var(--accent-soft); }
.input-row textarea {
  flex:1; min-height:34px; max-height:140px; resize:none; padding:8px 8px 8px 12px;
  font-size:13.5px; font-family:var(--font); line-height:1.5;
  background:transparent; border:none; color:var(--text); outline:none;
}
.input-row textarea::placeholder { color:#5b6373; }
.send-btn {
  font-family:var(--display); font-size:13px; font-weight:600; letter-spacing:0.2px; padding:0 20px; height:42px;
  background:linear-gradient(140deg, var(--accent), var(--accent-2)); border:none; border-radius:11px; color:#1a1206;
  cursor:pointer; transition:var(--transition); box-shadow:0 6px 18px -6px var(--accent-glow);
}
.send-btn:hover { transform:translateY(-1px); box-shadow:0 10px 26px -8px var(--accent-glow), 0 0 0 1px rgba(245,177,61,0.4); }
.send-btn:active { transform:translateY(0); }
.send-btn:disabled { opacity:0.6; cursor:default; transform:none; }

@media (max-width:640px) {
  html, body { height:100vh; height:100dvh; width:100%; overflow:hidden; font-size:13px; }
  #chat-app { height:100vh; height:100dvh; min-height:0; }
  .chat-topbar { height:auto; min-height:52px; padding:8px 10px; gap:6px; flex-wrap:wrap; align-content:center; }
  .chat-topbar .agent-avatar { width:30px; height:30px; min-width:30px; font-size:14px; }
  .chat-topbar .agent-name { flex:1 1 auto; min-width:0; max-width:calc(100vw - 200px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .chat-topbar .agent-sub { display:none; }
  .chat-topbar .token-count { order:4; margin-left:0; font-size:9px; min-width:38px; }
  .chat-topbar > #media-btn { margin-left:auto; }
  #convo-select { order:30!important; flex:1 1 calc(100% - 44px); max-width:none!important; min-width:0; margin-top:2px; }
  #convo-new { order:31; }
  .panel { max-height:42dvh; }
  .notification-top { align-items:flex-start; }
  .notification-title { white-space:normal; overflow-wrap:anywhere; }
  .messages { min-height:0; padding:14px 10px; gap:12px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .msg { max-width:100%; gap:8px; }
  .msg .avatar { width:28px; height:28px; min-width:28px; font-size:12px; margin-top:16px; }
  .msg > div:last-child { min-width:0; max-width:calc(100vw - 46px); }
  .bubble { max-width:100%; padding:10px 13px; font-size:13px; overflow-wrap:anywhere; word-break:break-word; }
  .bubble pre { max-width:100%; white-space:pre-wrap; word-break:break-word; overflow-x:auto; }
  .chat-status-bar { padding:6px 10px; }
  .stats-bar { display:none; }
  .input-area { padding:10px; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
  .input-row textarea { min-height:40px; max-height:34dvh; font-size:16px; }
  .send-btn { height:44px; padding:0 14px; flex-shrink:0; }
}
</style>

</head>
<body>

<div id="chat-app">
  <div class="chat-topbar">
    <button class="clear-btn" id="media-btn" title="Medien (Videos/Bilder)" style="font-size:15px;">&#x1F39E;&#xFE0F;</button>
    <button class="clear-btn" id="video-create-btn" title="Video erzeugen (direkte Pipeline)" style="font-size:15px;">&#x1F3AC;</button>
    <button class="clear-btn" id="image-create-btn" title="Bild erzeugen (KI-Bild)" style="font-size:15px;">&#x1F3A8;</button>
    <button class="clear-btn" id="planner-btn" title="Redaktionsplan (Video-Vorschläge)" style="font-size:15px;">&#x1F4CB;</button>
    <button class="clear-btn" id="pipeline-btn" title="Pipeline-Flow — was die KI gerade tut" style="font-size:15px;">&#x1F500;</button>
    <button class="clear-btn" id="modcfg-btn" title="Module verwalten &amp; einstellen" style="font-size:15px;">&#x2699;&#xFE0F;</button>
    <div class="agent-avatar" id="agent-avatar">A</div>
    <span class="agent-name" id="agent-name">Agent</span>
    <span class="agent-sub" id="agent-sub"></span>
    <span class="token-count" id="token-count"></span>
    <select id="convo-select" style="background:var(--bg-input);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:10px;padding:2px 6px;border-radius:4px;max-width:180px;cursor:pointer;"></select>
    <button class="clear-btn" id="convo-new" title="Neue Conversation" style="font-size:12px;">+</button>
    <div class="status-dot" id="status-dot"></div>
    <button class="clear-btn notification-btn" id="notification-btn" title="Notifications" style="font-size:14px;">&#x1F514;<span class="notification-count" id="notification-count">0</span></button>
    <button class="clear-btn" id="files-btn" title="Datei-Explorer" style="font-size:15px;">&#x1F4C1;</button>
    <button class="clear-btn" id="clear-btn" title="Conversation loeschen">&#x1F5D1;</button>
  </div>
  <div id="notification-panel" class="panel">
    <div class="panel-head">
      <span class="panel-title">Notifications</span>
      <button class="clear-btn" id="notifications-refresh" style="font-size:10px; padding:2px 6px;">&#x21BB;</button>
    </div>
    <div id="notification-list" class="notification-list"></div>
  </div>
  <div id="media-panel" class="panel">
    <div class="panel-head">
      <span class="panel-title">Medien — zuletzt erstellt</span>
      <button class="clear-btn" id="media-refresh" style="font-size:10px; padding:2px 6px;">&#x21BB;</button>
    </div>
    <div id="media-list" style="max-height:46dvh;overflow:auto;"></div>
  </div>
  <div id="planner-panel" class="panel">
    <div class="panel-head">
      <span class="panel-title">&#x1F5F3;&#xFE0F; Themen-Voting — die KI bewertet &amp; wählt</span>
      <div style="display:flex;gap:4px;">
        <button class="clear-btn" id="planner-scan" style="font-size:10px; padding:2px 6px; color:var(--cyan);" title="Jetzt nach neuen Themen suchen">&#x1F50D; Scan</button>
        <button class="clear-btn" id="planner-refresh" style="font-size:10px; padding:2px 6px;">&#x21BB;</button>
      </div>
    </div>
    <div id="planner-list" style="max-height:52dvh;overflow:auto;"></div>
  </div>
  <div id="pipeline-panel" class="panel">
    <div class="panel-head">
      <span class="panel-title">Pipeline — was die KI gerade tut</span>
      <button class="clear-btn" id="pipeline-refresh" style="font-size:10px;padding:2px 6px;">&#x21BB;</button>
    </div>
    <div id="pipeline-flow" style="max-height:54dvh;overflow:auto;padding:6px 10px;"></div>
  </div>
  <div id="modcfg-panel" class="panel">
    <div class="panel-head">
      <span class="panel-title">&#x2699;&#xFE0F; Module &amp; Einstellungen</span>
      <button class="clear-btn" id="modcfg-refresh" style="font-size:10px;padding:2px 6px;">&#x21BB;</button>
    </div>
    <div id="modcfg-body" style="max-height:54dvh;overflow:auto;padding:8px 10px;"></div>
  </div>
  <div id="file-panel" class="panel" style="max-height:250px;">
    <div class="panel-head">
      <span class="panel-title">Home-Verzeichnis</span>
      <div style="display:flex;gap:4px;">
        <button class="clear-btn" id="files-delete-all" style="font-size:10px; padding:2px 6px; color:var(--red);" title="Alle Dateien loeschen">&#x1F5D1; Alle</button>
        <button class="clear-btn" id="files-refresh" style="font-size:10px; padding:2px 6px;">&#x21BB;</button>
      </div>
    </div>
    <div id="file-tree" style="padding:4px 8px;"></div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chat-status-bar" id="status-bar"><div class="spinner"></div><span id="status-text">Generating...</span></div>
  <div class="stats-bar">
    <span>prompt: <span class="sv" id="s-prompt">-</span></span>
    <span>|</span>
    <span>eval: <span class="sv" id="s-eval">-</span></span>
    <span>|</span>
    <span>total: <span class="sv" id="s-total">-</span></span>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="Nachricht eingeben..." rows="1"></textarea>
      <button class="send-btn" id="send-btn">Senden</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ═══ STATE ═══ */
var modulId = '';
var modulConfig = null;
var chatHistory = [];
var streaming = false;
var currentConvoId = '';
var notificationPoll = null;
var lastConvoRefreshNotificationId = '';

var TOKEN_PARAM = new URLSearchParams(window.location.search).get('token');
if (TOKEN_PARAM) {
  localStorage.setItem('api_auth_token', TOKEN_PARAM);
  history.replaceState(null, '', window.location.pathname + window.location.hash);
}

function authHeaders(extra) {
  var headers = extra || {};
  var token = localStorage.getItem('api_auth_token') || '';
  if (token) headers.Authorization = 'Bearer ' + token;
  return headers;
}

function apiFetch(path, opts) {
  opts = opts || {};
  opts.headers = authHeaders(opts.headers || {});
  return fetch(path, opts).then(function(res) {
    if (res.status === 401) throw new Error('HTTP 401: Admin token fehlt oder ist falsch. Chat mit ?token=... oeffnen.');
    return res;
  });
}

/* ═══ Conversations ═══ */
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

function isTransientNetworkErrorMessage(m) {
  if (!m || m.role !== 'assistant') return false;
  var content = String(m.content || '').trim().toLowerCase();
  return content === 'error: network error'
    || content === 'error: failed to fetch'
    || content.indexOf('verbindung abgebrochen:') === 0;
}

function normalizeChatMessages(messages) {
  return (messages || []).filter(function(m) { return !isTransientNetworkErrorMessage(m); });
}

function loadConvoList() {
  if (!modulId) return;
  apiFetch('/api/convos/' + modulId).then(function(r) { return r.json(); }).then(function(data) {
    var sel = ge('convo-select');
    sel.innerHTML = '';
    (data.conversations || []).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id;
      var label = (c.title || 'Conversation').substring(0, 25);
      var msgs = (c.messages || []).length;
      opt.textContent = label + ' (' + msgs + ')';
      sel.appendChild(opt);
    });
    if (currentConvoId) sel.value = currentConvoId;
  });
}

function loadConvo(id) {
  if (!id || !modulId) return;
  apiFetch('/api/convos/' + modulId + '/' + id).then(function(r) { return r.json(); }).then(function(c) {
    if (c.error) return;
    currentConvoId = c.id;
    chatHistory = normalizeChatMessages(c.messages);
    ge('messages').innerHTML = '';
    var name = modulConfig ? ((modulConfig.identity && modulConfig.identity.bot_name) || modulConfig.display_name) : 'Agent';
    chatHistory.forEach(function(m) { appendMsg(m.role, m.content, name); });
    estimateTokens();
    loadNotifications(false);
  });
}

function saveConvo() {
  if (!currentConvoId || !modulId || chatHistory.length === 0) return;
  chatHistory = normalizeChatMessages(chatHistory);
  var title = '';
  for (var i = 0; i < chatHistory.length; i++) {
    if (chatHistory[i].role === 'user') { title = chatHistory[i].content.substring(0, 40); break; }
  }
  var convo = {
    id: currentConvoId,
    title: title || 'Neue Conversation',
    messages: chatHistory,
    updated: new Date().toISOString(),
  };
  apiFetch('/api/convos/' + modulId + '/' + currentConvoId, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(convo)
  });
}

function newConvo() {
  currentConvoId = genId();
  chatHistory = [];
  ge('messages').innerHTML = '';
  ge('token-count').textContent = '';
  if (modulConfig && modulConfig.identity && modulConfig.identity.greeting) {
    var name = (modulConfig.identity && modulConfig.identity.bot_name) || modulConfig.display_name;
    appendMsg('assistant', modulConfig.identity.greeting, name);
  }
  // NICHT sofort speichern — erst wenn die erste User-Nachricht kommt
  loadConvoList();
  loadNotifications(false);
}

ge('convo-select').addEventListener('change', function() { loadConvo(this.value); });
ge('convo-new').addEventListener('click', newConvo);

/* ═══ Notifications ═══ */
function notificationsPath() {
  var path = '/api/notifications/' + modulId + '?include_read=true&limit=50';
  if (currentConvoId) path += '&convo_id=' + encodeURIComponent(currentConvoId);
  return path;
}

function formatNotificationTime(ts) {
  if (!ts) return '';
  try {
    return new Date(ts * 1000).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch(e) {
    return String(ts);
  }
}

function updateNotificationBadge(unread) {
  var badge = ge('notification-count');
  unread = unread || 0;
  badge.textContent = unread > 99 ? '99+' : String(unread);
  if (unread > 0) badge.classList.add('visible');
  else badge.classList.remove('visible');
}

function loadNotifications(markRead) {
  if (!modulId) return;
  apiFetch(notificationsPath()).then(function(r) { return r.json(); }).then(function(data) {
    var items = data.notifications || [];
    renderNotifications(items);
    updateNotificationBadge(data.unread || 0);
    maybeRefreshConvoFromNotifications(items);
    if (markRead) {
      var unreadIds = items.filter(function(n) { return !n.read; }).map(function(n) { return n.id; });
      if (unreadIds.length) {
        Promise.all(unreadIds.map(function(id) { return markNotificationRead(id); }))
          .then(function() { loadNotifications(false); })
          .catch(function() {});
      }
    }
  }).catch(function() {});
}

function maybeRefreshConvoFromNotifications(items) {
  if (streaming || !currentConvoId) return;
  for (var i = 0; i < items.length; i++) {
    var n = items[i];
    if (n.read || n.convo_id !== currentConvoId) continue;
    if ((n.source || '').indexOf('task:') !== 0 && n.title !== 'Aufgabe fertig') continue;
    if (n.id === lastConvoRefreshNotificationId) return;
    lastConvoRefreshNotificationId = n.id;
    loadConvo(currentConvoId);
    return;
  }
}

function renderNotifications(items) {
  var list = ge('notification-list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="notification-empty">Keine Notifications</div>';
    return;
  }
  items.forEach(function(n) {
    var item = document.createElement('div');
    item.className = 'notification-item' + (n.read ? '' : ' unread');

    var top = document.createElement('div');
    top.className = 'notification-top';
    var title = document.createElement('div');
    title.className = 'notification-title';
    title.textContent = n.title || n.kind || 'Notification';
    var actions = document.createElement('div');
    actions.className = 'notification-actions';
    var time = document.createElement('span');
    time.className = 'notification-time';
    time.textContent = formatNotificationTime(n.created_ts);
    var del = document.createElement('button');
    del.className = 'clear-btn';
    del.style.cssText = 'font-size:10px;padding:1px 6px;color:var(--red);margin-left:0;';
    del.title = 'Notification loeschen';
    del.textContent = '×';
    del.addEventListener('click', function(ev) {
      ev.stopPropagation();
      deleteNotification(n.id);
    });
    actions.appendChild(time);
    actions.appendChild(del);
    top.appendChild(title);
    top.appendChild(actions);

    var body = document.createElement('div');
    body.className = 'notification-body';
    body.textContent = n.body || '';
    item.appendChild(top);
    item.appendChild(body);
    list.appendChild(item);
  });
}

function markNotificationRead(id) {
  return apiFetch('/api/notifications/' + modulId + '/' + encodeURIComponent(id), {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({read: true})
  });
}

function deleteNotification(id) {
  apiFetch('/api/notifications/' + modulId + '/' + encodeURIComponent(id), {method: 'DELETE'})
    .then(function() { loadNotifications(false); });
}

ge('notification-btn').addEventListener('click', function() {
  var panel = ge('notification-panel');
  var open = panel.style.display === 'block';
  ge('file-panel').style.display = 'none';
  ge('modcfg-panel').style.display = 'none';
  panel.style.display = open ? 'none' : 'block';
  if (!open) loadNotifications(true);
});

/* ═══ INIT — Modul-ID aus URL (/chat/id) oder aus injiziertem Meta-Tag ═══ */
(function() {
  // Option 1: Meta-Tag (wenn über eigenen Port bedient)
  var meta = document.querySelector('meta[name="modul-id"]');
  if (meta) { modulId = meta.content; }
  // Option 2: URL-Pfad /chat/modul-id (Fallback auf Admin-Port)
  if (!modulId) {
    var path = window.location.pathname;
    var parts = path.split('/').filter(Boolean);
    if (parts.length >= 2 && parts[0] === 'chat') {
      modulId = parts.slice(1).join('/');
    }
  }
  if (!modulId) {
    document.getElementById('messages').innerHTML = '<div style="text-align:center;padding:40px;color:#ff4466;">Kein Modul angegeben.</div>';
    return;
  }
  loadModul();
})();

function loadModul() {
  // Config vom Admin-Port oder gleichen Port laden
  var configUrl = '/api/config';
  apiFetch(configUrl).then(function(r) { return r.json(); }).then(function(cfg) {
    var mod = cfg.module.find(function(m) { return m.id === modulId; });
    if (!mod) {
      ge('messages').innerHTML = '<div style="text-align:center;padding:40px;color:#ff4466;">Modul "' + esc(modulId) + '" nicht gefunden.</div>';
      return;
    }
    modulConfig = mod;
    var name = (mod.identity && mod.identity.bot_name) || mod.display_name;
    document.title = name + ' — Chat';
    ge('agent-name').textContent = name;
    ge('agent-avatar').textContent = name.charAt(0).toUpperCase();
    ge('agent-sub').textContent = mod.id + ' (' + mod.typ + ')';
    ge('status-dot').className = 'status-dot';
    if (notificationPoll) clearInterval(notificationPoll);
    loadNotifications(false);
    notificationPoll = setInterval(function() { loadNotifications(false); }, 10000);
    // Conversations laden
    apiFetch('/api/convos/' + modulId).then(function(r) { return r.json(); }).then(function(data) {
      var convos = data.conversations || [];
      if (convos.length > 0) {
        currentConvoId = convos[0].id; // Neueste laden
        loadConvo(currentConvoId);
        loadConvoList();
      } else {
        newConvo(); // Neue starten
      }
    }).catch(function() { newConvo(); });
  }).catch(function() {
    ge('status-dot').className = 'status-dot error';
  });
}

/* ═══ UTILS ═══ */
function ge(id) { return document.getElementById(id); }
function esc(s) { var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

function renderMd(text) {
  if (!text) return '';
  var toolMatch = text.match(/<tool>(.*?)<\/tool>/);
  var toolHtml = '';
  if (toolMatch) toolHtml = '<div style="color:var(--cyan);font-size:11px;padding:4px 8px;margin:4px 0;border-left:2px solid var(--cyan);background:rgba(0,238,255,0.05);">Tool: ' + esc(toolMatch[1]) + '</div>';
  var clean = text.replace(/<tool>[\s\S]*?<\/tool>/g, '').trim();
  var safe = esc(clean);
  safe = safe.replace(/```[\w]*\n([\s\S]*?)```/g, function(_, c) { return '<pre><code>' + c + '</code></pre>'; });
  safe = safe.replace(/```([\s\S]*?)```/g, function(_, c) { return '<pre><code>' + c + '</code></pre>'; });
  safe = safe.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  var parts = safe.split(/(<pre>[\s\S]*?<\/pre>)/g);
  for (var i = 0; i < parts.length; i++) { if (!parts[i].startsWith('<pre>')) parts[i] = parts[i].replace(/\n/g, '<br>'); }
  return toolHtml + parts.join('');
}

function estimateTokens() {
  var c = 0; chatHistory.forEach(function(m) { c += (m.content || '').length; });
  var est = Math.round(c / 4);
  ge('token-count').textContent = est > 0 ? ('~' + est + ' tok') : '';
}

/* ═══ MESSAGES ═══ */
function appendMsg(role, content, name) {
  var container = ge('messages');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var letter = role === 'user' ? 'U' : ((name || 'A').charAt(0).toUpperCase());
  var label = role === 'user' ? 'You' : (name || 'Agent');
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'assistant') { bubble.innerHTML = renderMd(content); } else { bubble.textContent = content; }
  var nameEl = document.createElement('div'); nameEl.className = 'name'; nameEl.textContent = label;
  var avatarEl = document.createElement('div'); avatarEl.className = 'avatar'; avatarEl.textContent = letter;
  var bodyEl = document.createElement('div'); bodyEl.appendChild(nameEl); bodyEl.appendChild(bubble);
  div.appendChild(avatarEl); div.appendChild(bodyEl);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function appendStream(name) {
  var container = ge('messages');
  var div = document.createElement('div'); div.className = 'msg assistant';
  var avatarEl = document.createElement('div'); avatarEl.className = 'avatar'; avatarEl.textContent = (name || 'A').charAt(0).toUpperCase();
  var nameEl = document.createElement('div'); nameEl.className = 'name'; nameEl.textContent = name || 'Agent';
  var span = document.createElement('span'); span.className = 'stream-text';
  var cursor = document.createElement('span'); cursor.className = 'typing-cursor';
  var bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.appendChild(span); bubble.appendChild(cursor);
  var bodyEl = document.createElement('div'); bodyEl.appendChild(nameEl); bodyEl.appendChild(bubble);
  div.appendChild(avatarEl); div.appendChild(bodyEl);
  container.appendChild(div); container.scrollTop = container.scrollHeight;
  return div;
}

/* ═══ SEND ═══ */
function send() {
  if (streaming || !modulId) return;
  var input = ge('input');
  var text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';

  var agentName = modulConfig ? ((modulConfig.identity && modulConfig.identity.bot_name) || modulConfig.display_name) : 'Agent';
  if (!currentConvoId) newConvo();
  chatHistory.push({ role: 'user', content: text });
  appendMsg('user', text);
  estimateTokens();
  saveConvo();

  streaming = true;
  ge('send-btn').disabled = true; ge('send-btn').textContent = '...';
  setStatus('Generating...');

  var streamDiv = appendStream(agentName);
  var streamText = streamDiv.querySelector('.stream-text');
  var cursor = streamDiv.querySelector('.typing-cursor');
  var fullContent = '';
  var streamError = '';

  apiFetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ modul: modulId, convo_id: currentConvoId, messages: chatHistory })
  }).then(function(res) {
    if (!res.ok) return res.json().catch(function() { return { error: 'HTTP ' + res.status }; }).then(function(e) { throw new Error(e.error || 'HTTP ' + res.status); });
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    function read() {
      return reader.read().then(function(chunk) {
        if (chunk.done) { if (buffer.trim()) tryParse(buffer.trim()); return; }
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split('\n'); buffer = lines.pop();
        for (var i = 0; i < lines.length; i++) { var l = lines[i].trim(); if (l) tryParse(l); }
        return read();
      });
    }

    function tryParse(line) {
      try {
        var obj = JSON.parse(line);
        if (obj.type === 'status') {
          setStatus(obj.message);
          return;
        }
        if (obj.error) {
          streamError = String(obj.error);
          fullContent = 'Error: ' + streamError;
          streamText.innerHTML = '<span style="color:var(--red)">' + esc(fullContent) + '</span>';
          setStatus(null);
          return;
        }
        if (obj.message && obj.message.content) {
          fullContent += obj.message.content;
          streamText.innerHTML = renderMd(fullContent);
          ge('messages').scrollTop = ge('messages').scrollHeight;
        }
        if (obj.done) {
          if (obj.eval_count && obj.eval_duration) ge('s-eval').textContent = obj.eval_count + ' tok, ' + (obj.eval_count / (obj.eval_duration / 1e9)).toFixed(1) + ' tok/s';
          if (obj.prompt_eval_count && obj.prompt_eval_duration) ge('s-prompt').textContent = obj.prompt_eval_count + ' tok';
          if (obj.total_duration) ge('s-total').textContent = (obj.total_duration / 1e9).toFixed(1) + 's';
          setStatus(null);
        }
      } catch(e) {}
    }

    return read();
  }).then(function() {
    if (cursor && cursor.parentNode) cursor.parentNode.removeChild(cursor);
    if (streamError) {
      streamText.innerHTML = '<span style="color:var(--red)">' + esc(fullContent) + '</span>';
    } else if (!fullContent || !fullContent.trim()) {
      fullContent = '(Antwort war leer — Aufgaben im Board pruefen)';
      streamText.innerHTML = '<span style="color:var(--orange);">' + fullContent + '</span>';
    }
    chatHistory.push({ role: 'assistant', content: fullContent });
    estimateTokens();
    saveConvo();
    loadConvoList();
  }).catch(function(e) {
    if (cursor && cursor.parentNode) cursor.parentNode.removeChild(cursor);
    var errMsg = e.message || 'Unbekannter Fehler';
    streamText.innerHTML = '<span style="color:var(--red)">Verbindung abgebrochen: ' + esc(errMsg) + '</span>';
    if (currentConvoId) {
      setTimeout(function() { loadConvo(currentConvoId); }, 1500);
    }
  }).finally(function() {
    streaming = false;
    ge('send-btn').disabled = false; ge('send-btn').textContent = 'Senden';
    setStatus(null);
    loadNotifications(false);
  });
}

function setStatus(text) {
  var el = ge('status-bar');
  if (text) { ge('status-text').textContent = text; el.classList.add('visible'); }
  else { el.classList.remove('visible'); }
}

function loadFileTree() {
  if (!modulId) return;
  apiFetch('/api/home/' + modulId).then(function(r) { return r.json(); }).then(function(data) {
    var tree = ge('file-tree');
    if (!data.files || data.files.length === 0) {
      tree.innerHTML = '<div style="color:var(--text-dim); padding:8px; font-style:italic;">Leer</div>';
      return;
    }
    tree.innerHTML = renderTree(data.files, 0);
  }).catch(function() {
    ge('file-tree').innerHTML = '<div style="color:var(--red); padding:8px;">Fehler beim Laden</div>';
  });
}

function renderTree(files, depth) {
  var html = '';
  var indent = depth * 16;
  files.forEach(function(f) {
    if (f.type === 'dir') {
      html += '<div style="padding:2px 4px 2px ' + indent + 'px; color:var(--cyan);">&#x1F4C1; ' + esc(f.name) + '</div>';
      if (f.children && f.children.length > 0) {
        html += renderTree(f.children, depth + 1);
      }
    } else {
      var sizeStr = f.size < 1024 ? f.size + 'B' : (f.size / 1024).toFixed(1) + 'KB';
      html += '<div class="file-entry" style="padding:2px 4px 2px ' + indent + 'px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-radius:3px;" '
        + 'onmouseover="this.style.background=\'rgba(0,238,255,0.06)\'" onmouseout="this.style.background=\'none\'">'
        + '<span onclick="openFile(\'' + esc(f.path).replace(/'/g, "\\'") + '\')" style="flex:1;">&#x1F4C4; ' + esc(f.name) + '</span>'
        + '<span style="color:var(--text-dim); font-size:9px; margin-right:6px;">' + sizeStr + '</span>'
        + '<span onclick="event.stopPropagation();deleteFile(\'' + esc(f.path).replace(/'/g, "\\'") + '\')" style="color:var(--red);cursor:pointer;font-size:10px;" title="Loeschen">&#x2716;</span>'
        + '</div>';
    }
  });
  return html;
}

function loadPlanner() {
  var list = ge('planner-list');
  if (!list.innerHTML) list.innerHTML = '<div style="padding:10px;color:var(--text-dim);font-size:11px;">lade…</div>';
  Promise.all([
    apiFetch('/api/planner/status').then(function(r) { return r.json(); }).catch(function() { return {}; }),
    apiFetch('/api/planner/proposals').then(function(r) { return r.json(); }).catch(function() { return {}; })
  ]).then(function(res) {
    var st = res[0] || {}, data = res[1] || {};
    var items = (data && data.proposals) || [];
    var body;
    if (!items.length) {
      body = '<div style="padding:12px;color:var(--text-dim);font-size:11px;">Noch keine Vorschläge. Klick oben auf &#x1F50D; Scan — dann sucht die KI aktuelle Themen.</div>';
    } else {
      body = '';
      var leaderMarked = false;
      items.forEach(function(p, i) {
        var rank = i + 1;
        var score = p.score || 0;
        var srcArr = Array.isArray(p.sources) ? p.sources : (p.sources ? [String(p.sources)] : []);
        var srcs = srcArr.slice(0, 3).map(function(u) {
          u = String(u);
          return /^https?:\/\//.test(u)
            ? '<a href="' + esc(u) + '" target="_blank" style="color:var(--cyan);font-size:9px;">Quelle</a>'
            : '<span style="color:var(--text-dim);font-size:9px;" title="' + esc(u) + '">' + esc(u.slice(0, 22)) + '</span>';
        }).join(' · ');
        var isDone = (p.status === 'now' || p.status === 'approved');
        var isCandidate = (p.status === 'proposed' || p.status === 'next' || p.status === 'queued');
        var isLeader = false;
        if (isCandidate && !leaderMarked) { isLeader = true; leaderMarked = true; }
        var tag = isDone ? '<span style="color:#3a3;font-size:9px;">✓ schon produziert</span>'
          : (isLeader ? '<span style="color:#f5c518;font-size:9px;font-weight:700;">\u{1F451} Sieger → wird als Nächstes produziert</span>' : '');
        var dim = isDone ? 'opacity:0.5;' : '';
        var sc = isDone ? 'var(--text-dim)' : (score >= 85 ? '#3a3' : (score >= 70 ? 'var(--cyan)' : 'var(--text-dim)'));
        var sb = p.scores || {};
        var hasB = (sb.trend != null);
        var vData = hasB ? (' data-vb="1" data-trend="' + (sb.trend || 0) + '" data-hook="' + (sb.hook || 0) + '" data-gap="' + (sb.gap || 0) + '" data-watch="' + (sb.watchtime || 0) + '" data-pen="' + (p.similarity_penalty || 0) + '" data-score="' + score + '"') : '';
        body += '<div style="display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);' + dim + (isLeader ? 'background:rgba(245,197,24,0.07);' : '') + '">'
          + '<div class="vote-box"' + vData + ' style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:42px;border:1.5px solid ' + sc + ';border-radius:7px;padding:3px 2px;' + (hasB ? 'cursor:pointer;' : '') + '">'
          + '<span style="font-size:17px;font-weight:800;color:' + sc + ';line-height:1;">' + score + '</span>'
          + '<span style="font-size:7px;color:var(--text-dim);letter-spacing:1px;">VOTE' + (hasB ? ' ⓘ' : '') + '</span></div>'
          + '<div style="flex:1;min-width:0;">'
          + '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap;">'
          + '<span style="font-size:9px;color:var(--text-dim);font-weight:700;">#' + rank + '</span>'
          + plannerBadge(p.status) + '<span style="font-size:8px;color:var(--text-dim);">' + esc(p.theme || '') + '</span>' + tag + '</div>'
          + '<div style="font-size:12px;color:var(--text-bright);margin-bottom:2px;">' + esc(p.title || '') + '</div>'
          + (p.rationale ? '<div style="font-size:10px;color:var(--text-dim);margin-bottom:3px;line-height:1.4;max-height:42px;overflow:hidden;">' + esc(p.rationale) + '</div>' : '')
          + '<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;">'
          + (isDone ? '' : (plannerBtn(p.id, 'now', '▶ Jetzt', 'var(--red)') + plannerBtn(p.id, 'approve', '✓ Genehmigen', '#3a3') + plannerBtn(p.id, 'next', 'Nächstes', 'var(--cyan)')))
          + plannerBtn(p.id, 'reject', '✕', 'var(--text-dim)')
          + (srcs ? '<span style="margin-left:auto;">' + srcs + '</span>' : '')
          + '</div></div></div>';
      });
    }
    var head = '';
    try { head = renderPlannerHead(st); } catch (e) { head = ''; }
    list.innerHTML = head + body;
    list.querySelectorAll('[data-pa]').forEach(function(el) {
      el.addEventListener('click', function() { plannerDecide(el.getAttribute('data-pid'), el.getAttribute('data-pa')); });
    });
    list.querySelectorAll('.vote-box[data-vb]').forEach(function(el) {

}

  apiFetch('/api/planner/decide', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: id, action: action, modul: modulId})})
    .then(function(r) { return r.json(); }).then(function(d) {

    }).catch(function(e) { alert('Fehler: ' + e); });
}

  ]).then(function(res) {

  }).catch(function() { box.innerHTML = '<div style="color:var(--red);padding:10px;font-size:11px;">Laden fehlgeschlagen.</div>'; });

function renderFlow(wf, ps, cs) {
  var wfs = wf.workflows || [];
  var active = wfs.filter(function(w) { return w.status === 'running' || w.status === 'waiting'; })[0] || wfs[0] || null;
  var by = ps.by_status || {};
  var qcount = (by.proposed || 0) + (by.next || 0) + (by.queued || 0);
  var ap = ps.autopilot ? '<span style="color:#3a3;">● AN</span>' : '<span style="color:var(--text-dim);">○ AUS</span>';
  var html = '<div style="font-size:9px;color:var(--text-dim);margin:2px 0;">AUTOPILOT ' + ap + ' &middot; Auto-Crawl ' + esc(cronHuman(ps.schedule)) + '</div>';
  html += flowRow([
    flowNode('\u{1F50D}', 'Recherche', 'websearch/grok', active && active.stage === 'deepdive_report' ? 'running' : 'idle'),
    flowNode('▣', 'Queue: ' + qcount, 'content_planner', qcount > 0 ? 'done' : 'idle'),
    flowNode('⚡', 'Auto-Produce', '', (by.now || 0) > 0 ? 'running' : 'idle')
  ]);
  var themes = (ps.interests || []).map(function(t) { return '<span style="font-size:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:1px 5px;color:var(--text-dim);">' + esc(t) + '</span>'; }).join(' ');
  html += '<div style="display:flex;gap:3px;flex-wrap:wrap;margin:3px 0 8px;">' + themes + '</div>';
  html += '<div style="font-size:9px;color:var(--text-dim);margin:2px 0;">VIDEO-PIPELINE' + (active ? ' &middot; ' + esc((active.title || '').slice(0, 42)) : ' &middot; (idle)') + '</div>';
  var curIdx = active ? (PIPE_ORDER[active.stage] !== undefined ? PIPE_ORDER[active.stage] : -1) : -1;
  var allDone = active && active.status === 'success';
  html += flowRow(PIPE_STAGES.map(function(stg, i) {
    var stt = 'idle';
    if (active) {
      if (allDone) stt = 'done';
      else if (i < curIdx) stt = 'done';
      else if (i === curIdx) stt = (active.status === 'failed' ? 'failed' : 'running');
      else stt = 'pending';
    }
    return flowNode(stg.icon, stg.name, stg.modul, stt);
  }));
  html += active && active.last_event
    ? '<div style="font-size:9px;color:var(--cyan);margin:2px 0 8px;">▸ ' + esc(active.last_event.slice(0, 84)) + '</div>'
    : '<div style="margin-bottom:8px;"></div>';
  var cby = cs.drafts_by_status || {};
  html += '<div style="font-size:9px;color:var(--text-dim);margin:2px 0;">COMMUNITY &middot; Crawl ' + esc(cronHuman(cs.schedule)) + ' &middot; auto-post ' + (cs.auto_post ? 'AN' : 'AUS') + '</div>';
  html += flowRow([
    flowNode('\u{1F4AC}', 'Kommentare', 'community_manager', cs.credentials === 'ok' ? 'idle' : 'failed'),
    flowNode('✍️', 'Entwürfe: ' + (cby.draft || 0), '', (cby.draft || 0) > 0 ? 'done' : 'idle')
  ]);
  return html;
}

var mediaLoaded = false;
ge('media-btn').addEventListener('click', function() {
  var p = ge('media-panel');
  var open = p.style.display === 'block';
  ge('modcfg-panel').style.display = 'none';
  p.style.display = open ? 'none' : 'block';
  if (!open) loadMedia();
});
ge('media-refresh').addEventListener('click', loadMedia);

function fmtBytes(n) {
  if (n > 1e9) return (n / 1e9).toFixed(1) + ' GB';
  if (n > 1e6) return (n / 1e6).toFixed(1) + ' MB';
  return Math.round(n / 1e3) + ' KB';
}

function fmtDate(ts) {
  var d = new Date(ts * 1000);
  return d.toLocaleDateString('de-DE', {day: '2-digit', month: '2-digit', year: 'numeric'});
}

function fmtTime(ts) {
  var d = new Date(ts * 1000);
  return d.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
}

function loadMedia() {
  var list = ge('media-list');
  list.innerHTML = '<div style="padding:10px;color:var(--text-dim);font-size:11px;">lade…</div>';
  apiFetch('/api/media/' + modulId).then(function(r) { return r.json(); }).then(function(data) {
    var items = (data && data.media) || [];
    if (!items.length) {
      list.innerHTML = '<div style="padding:10px;color:var(--text-dim);font-size:11px;">Noch keine Medien.</div>';
      return;
    }
    var html = '';
    var lastDay = '';
    items.forEach(function(m) {
      var day = fmtDate(m.mtime);
      if (day !== lastDay) {
        html += '<div style="padding:6px 10px 2px;color:var(--cyan);font-size:9px;text-transform:uppercase;letter-spacing:1px;">' + day + '</div>';
        lastDay = day;
      }
      var icon = m.kind === 'video' ? '&#x1F3AC;' : (m.kind === 'audio' ? '&#x1F50A;' : '&#x1F5BC;&#xFE0F;');
      html += '<div class="media-item" data-path="' + esc(m.path) + '" data-kind="' + m.kind + '" '
        + 'style="display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--border);">'
        + '<span style="font-size:15px;">' + icon + '</span>'
        + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text);" title="' + esc(m.path) + '">' + esc(m.name) + '</span>'
        + '<span style="font-size:9px;color:var(--text-dim);white-space:nowrap;">' + fmtTime(m.mtime) + ' · ' + fmtBytes(m.size) + '</span>'
        + '</div>';
    });
    list.innerHTML = html;
    list.querySelectorAll('.media-item').forEach(function(el) {
      el.addEventListener('click', function() {
        previewMedia(el.getAttribute('data-path'), el.getAttribute('data-kind'));
      });
    });
  }).catch(function() {
    list.innerHTML = '<div style="padding:10px;color:var(--red);font-size:11px;">Laden fehlgeschlagen.</div>';
  });
}

function previewMedia(path, kind) {
  // Media-Tags senden keine Auth-Header — Datei als Blob mit Token laden.
  apiFetch(homeFileUrl(path)).then(function(r) { return r.blob(); }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    showMediaModal(path, kind, url);
    setTimeout(function() { URL.revokeObjectURL(url); }, 600000);
  }).catch(function(e) { alert('Laden fehlgeschlagen: ' + e); });
}

function showMediaModal(path, kind, url) {
  var inner;
  if (kind === 'video') {
    inner = '<video controls autoplay style="max-width:86vw;max-height:70vh;border-radius:8px;" src="' + url + '"></video>';
  } else if (kind === 'audio') {
    inner = '<audio controls autoplay style="width:60vw;" src="' + url + '"></audio>';
  } else {
    inner = '<img style="max-width:86vw;max-height:70vh;border-radius:8px;" src="' + url + '">';
  }
  var modal = '<div style="position:fixed;inset:0;z-index:9000;background:rgba(2,2,10,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;" onclick="this.remove()">'
    + '<div onclick="event.stopPropagation()" style="display:flex;flex-direction:column;align-items:center;gap:8px;">'
    + inner
    + '<div style="display:flex;gap:8px;align-items:center;">'
    + '<span style="color:var(--text-dim);font-size:10px;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(path) + '</span>'
    + '<button onclick="downloadFile(\'' + esc(path).replace(/'/g, "\\'") + '\')" style="background:none;border:1px solid var(--cyan);color:var(--cyan);cursor:pointer;border-radius:4px;padding:3px 10px;font-size:10px;font-family:var(--font);">Download</button>'
    + '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;border-radius:4px;padding:3px 10px;font-size:10px;font-family:var(--font);">Schliessen</button>'
    + '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', modal);
}

function homeFileUrl(path) {
  return '/api/home/' + modulId + '/' + encodeURIComponent(path);
}

function downloadFile(path) {
  apiFetch(homeFileUrl(path)).then(function(r) { return r.blob(); }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = path.split('/').pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 30000);
  });
}

function openFile(path) {
  var url = homeFileUrl(path);
  // Text-Dateien im Modal anzeigen, Rest im neuen Tab
  var ext = path.split('.').pop().toLowerCase();
  var textTypes = ['txt','md','html','htm','css','js','json','log','py','rs','toml','yaml','yml','sh','csv','xml'];
  if (textTypes.indexOf(ext) !== -1) {
    apiFetch(url).then(function(r) { return r.text(); }).then(function(text) {
      var pre = '<div style="position:fixed;inset:0;z-index:9000;background:rgba(2,2,10,0.9);display:flex;align-items:center;justify-content:center;" onclick="this.remove()">'
        + '<div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:16px;max-width:90%;max-height:80vh;overflow:auto;min-width:50%;" onclick="event.stopPropagation()">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">'
        + '<span style="color:var(--cyan);font-size:11px;">' + esc(path) + '</span>'
        + '<div style="display:flex;gap:4px;">'
        + '<button onclick="downloadFile(\'' + esc(path).replace(/'/g, "\\'") + '\')" style="background:none;border:1px solid var(--cyan);color:var(--cyan);cursor:pointer;border-radius:4px;padding:2px 8px;font-size:10px;text-decoration:none;font-family:var(--font);">Download</button>'
        + '<a href="' + url + '" target="_blank" style="background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;border-radius:4px;padding:2px 8px;font-size:10px;text-decoration:none;font-family:var(--font);">Oeffnen</a>'
        + '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;border-radius:4px;padding:2px 8px;font-size:10px;font-family:var(--font);">X</button>'
        + '</div></div>'
        + '<pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;font-size:11px;color:var(--text);white-space:pre-wrap;max-height:60vh;overflow:auto;">' + esc(text) + '</pre></div></div>';
      document.body.insertAdjacentHTML('beforeend', pre);
    });
  } else {
    downloadFile(path);
  }
}

ge('clear-btn').addEventListener('click', function() {
  if (!confirm('Conversation loeschen?')) return;
  if (currentConvoId) {
    apiFetch('/api/convos/' + modulId + '/' + currentConvoId, {method: 'DELETE'}).then(function() {
      newConvo();
    });
  } else {
    newConvo();
  }
});

/* ═══ ⚙️ Module-Verwaltung & Einstellungen ═══ */
ge('modcfg-btn').addEventListener('click', function () {
  var p = ge('modcfg-panel');
  var open = p.style.display === 'block';
  ['notification-panel','media-panel','planner-panel','pipeline-panel','file-panel'].forEach(function(id){var e=ge(id);if(e)e.style.display='none';});
  p.style.display = open ? 'none' : 'block';
  if (!open) loadModcfg();
});
ge('modcfg-refresh').addEventListener('click', loadModcfg);

function mcInput(name, spec, val) {
  var t = (spec && spec.type) || 'string';
  var v = (val !== undefined && val !== null) ? val : (spec && spec.default !== undefined ? spec.default : '');
  var base = 'background:var(--bg-input);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:6px 8px;border-radius:8px;width:100%;outline:none;';
  if (t === 'bool') {
    return '<label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--text);"><input type="checkbox" data-mc="'+esc(name)+'" data-mct="bool"'+(v?' checked':'')+'> '+esc((spec&&spec.label)||name)+'</label>';
  }
  var label = '<label style="font-size:10px;color:var(--text-dim);display:block;margin-bottom:3px;">'+esc((spec&&spec.label)||name)+'</label>';
  if (t === 'select' && spec && Array.isArray(spec.options)) {
    var opts = spec.options.map(function(o){return '<option value="'+esc(o)+'"'+(String(o)===String(v)?' selected':'')+'>'+esc(o)+'</option>';}).join('');
    return label+'<select data-mc="'+esc(name)+'" data-mct="select" style="'+base+'">'+opts+'</select>';
  }
  if (t === 'list') {
    var lv = Array.isArray(v) ? v.join(', ') : String(v||'');
    return label+'<input data-mc="'+esc(name)+'" data-mct="list" value="'+esc(lv)+'" placeholder="kommagetrennt" style="'+base+'">';
  }
  var it = (t==='number')?'number':((t==='password')?'password':'text');
  return label+'<input data-mc="'+esc(name)+'" data-mct="'+esc(t)+'" type="'+it+'" value="'+esc(v)+'" style="'+base+'">';
}

function collectMcValues(container) {
  var out = {};
  container.querySelectorAll('[data-mc]').forEach(function(el){
    var k = el.getAttribute('data-mc'), t = el.getAttribute('data-mct'), v;
    if (t==='bool') v = el.checked;
    else if (t==='number') v = (el.value==='')?null:parseFloat(el.value);
    else if (t==='list') v = el.value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    else v = el.value;
    out[k] = v;
  });
  return out;
}

function renderModuleForm(mod) {
  var wrap = document.createElement('div');
  wrap.style.cssText = 'padding:9px 2px 12px;';
  wrap.innerHTML = '<div style="font-size:10px;color:var(--text-dim);">lädt…</div>';
  var fields = Object.keys(mod.settings||{});
  apiFetch('/api/module-config/'+encodeURIComponent(mod.name)).then(function(r){return r.json();}).then(function(d){
    var cur = (d && d.config) || {};
    var html = '';
    fields.forEach(function(f){ html += '<div style="margin-bottom:9px;">'+mcInput(f, mod.settings[f], cur[f])+'</div>'; });
    html += '<div style="display:flex;gap:8px;align-items:center;"><button class="send-btn" data-mcsave style="height:31px;padding:0 14px;font-size:12px;">Speichern</button><span class="mc-status" style="font-size:10px;color:var(--text-dim);"></span></div>';
    wrap.innerHTML = html;
    wrap.querySelector('[data-mcsave]').addEventListener('click', function(){
      var vals = collectMcValues(wrap);
      var st = wrap.querySelector('.mc-status'); st.textContent='speichere…'; st.style.color='var(--text-dim)';
      apiFetch('/api/module-config/'+encodeURIComponent(mod.name), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(vals)})
        .then(function(r){return r.json();}).then(function(res){ st.textContent = res.ok?'✓ gespeichert':('Fehler: '+(res.error||'?')); st.style.color = res.ok?'var(--green)':'var(--red)'; })
        .catch(function(e){ st.textContent='Fehler: '+e; st.style.color='var(--red)'; });
    });
  }).catch(function(){ wrap.innerHTML='<div style="font-size:10px;color:var(--red);">Laden fehlgeschlagen.</div>'; });
  return wrap;
}

function renderModuleList(mods) {
  var box = ge('modcfg-body');
  var withSettings = (mods||[]).filter(function(m){ return m.settings && Object.keys(m.settings).length>0; });
  withSettings.sort(function(a,b){ return a.name<b.name?-1:1; });
  withSettings.forEach(function(m){
    var row = document.createElement('div');
    row.style.cssText='border:1px solid var(--border);border-radius:11px;margin-bottom:6px;overflow:hidden;';
    var head = document.createElement('div');
    head.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:9px 11px;cursor:pointer;transition:background 0.18s;';
    head.onmouseover=function(){head.style.background='rgba(255,255,255,0.03)';}; head.onmouseout=function(){head.style.background='none';};
    head.innerHTML = '<span style="font-size:12px;color:var(--text-bright);">'+esc(m.name)+'</span><span style="font-size:9px;color:var(--text-dim);">'+esc(m.source||'py')+' · '+Object.keys(m.settings).length+' ▸</span>';
    var body = document.createElement('div'); body.style.cssText='display:none;border-top:1px solid var(--border);padding:0 11px;';
    var loaded=false;
    head.addEventListener('click', function(){
      var open = body.style.display==='block';
      body.style.display = open?'none':'block';
      if(!open && !loaded){ loaded=true; body.appendChild(renderModuleForm(m)); }
    });
    row.appendChild(head); row.appendChild(body); box.appendChild(row);
  });
  if(!withSettings.length) box.innerHTML += '<div style="padding:10px;color:var(--text-dim);font-size:11px;">Keine konfigurierbaren Module.</div>';
}

function renderAutopilotSection(cfg) {
  var box = ge('modcfg-body');
  var cp = ((cfg&&cfg.module)||[]).find(function(m){return m.id==='content_planner.default';});
  if(!cp) return;
  var s = cp.settings || {};
  var on = !!s.autopilot;
  var sched = s.schedule || '0 18 * * *';
  var anw = s.cron_anweisung || '';
  var vm = anw.match(/upload_privacy"\s*:\s*"([a-z]+)"/);
  var vis = vm ? vm[1] : 'public';
  var presets = [['0 7 * * *','07:00'],['0 12 * * *','12:00'],['0 18 * * *','18:00'],['0 20 * * *','20:00']];
  var timeOpts = presets.map(function(p){return '<option value="'+p[0]+'"'+(p[0]===sched?' selected':'')+'>'+p[1]+' Uhr</option>';}).join('');
  if(presets.map(function(p){return p[0];}).indexOf(sched)<0) timeOpts += '<option value="'+esc(sched)+'" selected>'+esc(cronHuman(sched))+'</option>';
  var visOpts = [['public','Öffentlich'],['unlisted','Nicht gelistet'],['private','Privat']].map(function(p){return '<option value="'+p[0]+'"'+(p[0]===vis?' selected':'')+'>'+p[1]+'</option>';}).join('');
  var sel='background:var(--bg-input);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:6px 8px;border-radius:8px;';
  var wrap = document.createElement('div');
  wrap.style.cssText='border:1px solid rgba(245,177,61,0.28);background:var(--accent-soft);border-radius:13px;padding:12px 13px;margin-bottom:14px;';
  wrap.innerHTML =
    '<div style="font-family:var(--display);font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">\u{1F3AC} Auto-Pilot — täglich Video</div>'
    + '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:11px;"><input type="checkbox" id="ap-on"'+(on?' checked':'')+'> <span style="font-size:12px;color:var(--text);">Aktiv — produziert &amp; lädt automatisch hoch</span></label>'
    + '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:11px;">'
    + '<div><label style="font-size:10px;color:var(--text-dim);display:block;margin-bottom:3px;">Uhrzeit (täglich)</label><select id="ap-time" style="'+sel+'">'+timeOpts+'</select></div>'
    + '<div><label style="font-size:10px;color:var(--text-dim);display:block;margin-bottom:3px;">Sichtbarkeit</label><select id="ap-vis" style="'+sel+'">'+visOpts+'</select></div>'
    + '</div>'
    + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><button class="send-btn" id="ap-save" style="height:31px;padding:0 14px;font-size:12px;">Speichern</button><button class="clear-btn" id="ap-now" style="height:31px;">▶ Jetzt produzieren</button><span id="ap-status" style="font-size:10px;color:var(--text-dim);"></span></div>';
  box.appendChild(wrap);
  ge('ap-save').addEventListener('click', saveAutopilot);
  ge('ap-now').addEventListener('click', function(){
    if(!confirm('Jetzt einen Lauf starten → produziert + lädt ein Video hoch. Fortfahren?')) return;
    var st=ge('ap-status'); st.textContent='startet…';
    apiFetch('/api/planner/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.json();}).then(function(d){ st.textContent = d.started?'✓ Lauf gestartet':('Fehler: '+(d.error||'?')); st.style.color=d.started?'var(--green)':'var(--red)'; });
  });
}

function saveAutopilot(){
  var st = ge('ap-status'); st.textContent='speichere…'; st.style.color='var(--text-dim)';
  apiFetch('/api/config').then(function(r){return r.json();}).then(function(cfg){
    var cp = ((cfg&&cfg.module)||[]).find(function(m){return m.id==='content_planner.default';});
    if(!cp){ st.textContent='content_planner nicht gefunden'; st.style.color='var(--red)'; return; }
    cp.settings = cp.settings || {};
    cp.settings.autopilot = ge('ap-on').checked;
    cp.settings.schedule = ge('ap-time').value;
    cp.settings.cron_typ = 'llm';
    var vis = ge('ap-vis').value;
    var anw = cp.settings.cron_anweisung || '';
    if(/upload_privacy"\s*:\s*"[a-z]+"/.test(anw)) anw = anw.replace(/upload_privacy"\s*:\s*"[a-z]+"/, 'upload_privacy":"'+vis+'"');
    else if(anw.indexOf('"auto_upload":true,')>=0) anw = anw.replace('"auto_upload":true,', '"auto_upload":true,"upload_privacy":"'+vis+'",');
    cp.settings.cron_anweisung = anw;
    cfg._save_scope = ['module'];
    return apiFetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)}).then(function(r){return r.json();}).then(function(res){
      st.textContent = res.ok?'✓ gespeichert (sofort aktiv)':('Fehler: '+(res.error||'?')); st.style.color=res.ok?'var(--green)':'var(--red)';
    });
  }).catch(function(e){ st.textContent='Fehler: '+e; st.style.color='var(--red)'; });
}

function loadModcfg(){
  var box = ge('modcfg-body');
  box.innerHTML = '<div style="padding:10px;color:var(--text-dim);font-size:11px;">lädt…</div>';
  Promise.all([
    apiFetch('/api/config').then(function(r){return r.json();}).catch(function(){return {};}),
    apiFetch('/api/modules').then(function(r){return r.json();}).catch(function(){return {modules:[]};})
  ]).then(function(res){
    box.innerHTML='';
    try{ renderAutopilotSection(res[0]||{}); }catch(e){}
    var hdr = document.createElement('div'); hdr.style.cssText='font-family:var(--display);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.2px;margin:2px 2px 7px;'; hdr.textContent='Module — Einstellungen';
    box.appendChild(hdr);
    renderModuleList((res[1] && res[1].modules) || []);
  }).catch(function(){ box.innerHTML='<div style="padding:10px;color:var(--red);font-size:11px;">Laden fehlgeschlagen.</div>'; });
}
