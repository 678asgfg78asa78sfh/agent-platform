<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-deep: #060612; --bg-base: #0a0a1a; --bg-surface: #10102a; --bg-card: #14143a;
  --bg-input: #0c0c22; --blue: #00aaff; --green: #00ff88; --red: #ff4466;
  --orange: #ffaa00; --purple: #8855ff; --cyan: #00eeff;
  --cyan-glow: rgba(0,238,255,0.35); --purple-glow: rgba(136,85,255,0.3);
  --text: #d4d4e8; --text-dim: #8888aa; --text-bright: #eeeeff;
  --border: #222244; --font: 'Cascadia Code','Fira Code','Consolas',monospace;
  --radius: 6px; --radius-lg: 10px; --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
}
html, body { height: 100%; background: var(--bg-deep); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.5; overflow: hidden; }
::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

#chat-app { display: flex; flex-direction: column; height: 100vh; }

.chat-topbar {
  display: flex; align-items: center; padding: 0 16px; height: 42px; min-height: 42px;
  background: linear-gradient(180deg, #0c0c24 0%, var(--bg-base) 100%);
  border-bottom: 1px solid var(--border); position: relative;
}
.chat-topbar::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
  background-size: 200% 100%; animation: headerGlow 4s linear infinite; opacity: 0.7;
}
@keyframes headerGlow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
.chat-topbar .agent-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
  box-shadow: 0 0 10px var(--cyan-glow); margin-right: 10px;
}
.chat-topbar .agent-name { font-size: 13px; font-weight: 700; color: var(--text-bright); letter-spacing: 1px; }
.chat-topbar .agent-sub { font-size: 10px; color: var(--text-dim); margin-left: 8px; }
.chat-topbar .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(0,255,136,0.3); margin-left: auto; animation: blink 2s ease-in-out infinite; }
.chat-topbar .status-dot.error { background: var(--red); box-shadow: 0 0 8px rgba(255,68,102,0.3); }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
.chat-topbar .token-count { font-size: 10px; color: var(--text-dim); margin-left: 8px; }
.chat-topbar .clear-btn {
  font-family: var(--font); font-size: 13px; background: none; border: 1px solid var(--border);
  color: var(--text-dim); padding: 3px 8px; border-radius: var(--radius); cursor: pointer; margin-left: 8px;
}
.chat-topbar .clear-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.notification-btn { position: relative; min-width: 32px; }
.notification-count {
  position: absolute; top: -7px; right: -7px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 9px; background: var(--red); color: #fff; border: 1px solid var(--bg-base);
  display: none; align-items: center; justify-content: center; font-size: 9px; line-height: 14px;
}
.notification-count.visible { display: flex; }
.panel {
  display: none; border-bottom: 1px solid var(--border); background: var(--bg-surface);
  max-height: 280px; overflow-y: auto; font-size: 11px;
}
.panel-head {
  display: flex; justify-content: space-between; align-items: center; padding: 6px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.panel-title { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--cyan); }
.notification-list { padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
.notification-empty { color: var(--text-dim); padding: 8px; font-style: italic; }
.notification-item {
  border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 8px;
  background: rgba(255,255,255,0.02);
}
.notification-item.unread { border-color: rgba(0,238,255,0.35); background: rgba(0,238,255,0.05); }
.notification-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.notification-title { color: var(--text-bright); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notification-time { color: var(--text-dim); font-size: 9px; white-space: nowrap; }
.notification-body { color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.notification-actions { display: flex; align-items: center; gap: 6px; }

.messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; max-width: 80%; animation: msgIn 0.3s ease; }
@keyframes msgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { align-self: flex-start; }
.msg .avatar {
  width: 28px; height: 28px; min-width: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; margin-top: 2px;
}
.msg.user .avatar { background: linear-gradient(135deg, #009955, #0066aa); box-shadow: 0 0 8px rgba(0,255,136,0.3); color: #fff; }
.msg.assistant .avatar { background: linear-gradient(135deg, #5533aa, var(--cyan)); box-shadow: 0 0 8px var(--purple-glow); color: #fff; }
.bubble { padding: 8px 12px; border-radius: var(--radius-lg); line-height: 1.6; word-wrap: break-word; font-size: 12px; }
.msg.user .bubble { background: linear-gradient(135deg, #0d2a3a, #0a1e2e); border: 1px solid rgba(0,238,255,0.15); white-space: pre-wrap; }
.msg.assistant .bubble { background: var(--bg-card); border: 1px solid var(--border); }
.bubble code { background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 3px; font-size: 11px; color: var(--cyan); }
.bubble pre { background: rgba(0,0,0,0.4); padding: 8px; border-radius: var(--radius); overflow-x: auto; margin: 6px 0; border: 1px solid var(--border); }
.bubble pre code { background: none; padding: 0; color: var(--text); }
.bubble strong { color: var(--text-bright); } .bubble em { color: var(--text-dim); }
.bubble p { margin-bottom: 4px; } .bubble p:last-child { margin-bottom: 0; }
.name { font-size: 10px; font-weight: 600; margin-bottom: 2px; }
.msg.user .name { text-align: right; color: var(--blue); }
.msg.assistant .name { color: var(--purple); }
.typing-cursor { display: inline-block; width: 2px; height: 13px; background: var(--cyan); margin-left: 2px; vertical-align: middle; animation: cursorBlink 0.8s step-end infinite; }
@keyframes cursorBlink { 0%,100% { opacity:1; } 50% { opacity:0; } }

.chat-status-bar {
  padding: 3px 16px; font-size: 10px; color: var(--orange);
  background: rgba(255,170,0,0.04); border-top: 1px solid rgba(255,170,0,0.08);
  display: none; align-items: center; gap: 6px; flex-shrink: 0;
}
.chat-status-bar.visible { display: flex; }
.chat-status-bar .spinner { width: 10px; height: 10px; border: 2px solid rgba(170,119,0,1); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.stats-bar {
  display: flex; gap: 14px; padding: 4px 16px; font-size: 10px;
  color: var(--text-dim); background: var(--bg-deep);
  border-top: 1px solid rgba(255,255,255,0.02); flex-shrink: 0;
}
.stats-bar .sv { color: var(--green); font-weight: 600; }

.input-area { padding: 8px 16px; border-top: 1px solid var(--border); background: var(--bg-surface); flex-shrink: 0; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.input-row textarea {
  flex: 1; min-height: 36px; max-height: 120px; resize: none; padding: 8px 12px;
  border-radius: var(--radius-lg); font-size: 12px; font-family: var(--font);
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text); outline: none;
}
.input-row textarea:focus { border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
.send-btn {
  font-family: var(--font); font-size: 11px; padding: 8px 18px; height: 36px;
  background: linear-gradient(135deg, rgba(0,170,255,0.3), rgba(136,85,255,0.3));
  border: 1px solid var(--cyan); border-radius: var(--radius); color: var(--cyan);
  cursor: pointer; transition: var(--transition); letter-spacing: 0.5px;
}
.send-btn:hover { box-shadow: 0 0 14px var(--cyan-glow); color: #fff; transform: translateY(-1px); }

@media (max-width: 640px) {
  html, body { height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
  #chat-app { height: 100vh; height: 100dvh; min-height: 0; }
  .chat-topbar {
    height: auto; min-height: 48px; padding: 6px 8px; gap: 6px;
    flex-wrap: wrap; align-content: center;
  }
  .chat-topbar .agent-avatar { width: 26px; height: 26px; min-width: 26px; margin-right: 2px; font-size: 12px; }
  .chat-topbar .agent-name {
    flex: 1 1 auto; min-width: 0; max-width: calc(100vw - 190px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px;
  }
  .chat-topbar .agent-sub { display: none; }
  .chat-topbar .token-count { order: 4; margin-left: 0; font-size: 9px; min-width: 38px; }
  .chat-topbar .status-dot { margin-left: 0; flex-shrink: 0; }
  .chat-topbar .clear-btn { margin-left: 0; min-width: 32px; min-height: 32px; padding: 4px 7px; }
  #convo-select {
    order: 10; flex: 1 1 calc(100% - 42px); width: auto; max-width: none !important;
    min-width: 0; height: 32px; font-size: 11px; margin-top: 2px;
  }
  #convo-new { order: 10; }
  .panel { max-height: 38dvh; }
  .notification-top { align-items: flex-start; }
  .notification-title { white-space: normal; overflow-wrap: anywhere; }
  .messages {
    min-height: 0; padding: 10px 8px; gap: 8px;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  .msg { max-width: 100%; gap: 6px; }
  .msg .avatar { width: 24px; height: 24px; min-width: 24px; font-size: 11px; }
  .msg > div:last-child { min-width: 0; max-width: calc(100vw - 40px); }
  .bubble { max-width: 100%; padding: 8px 10px; font-size: 12px; overflow-wrap: anywhere; word-break: break-word; }
  .bubble pre { max-width: 100%; white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
  .chat-status-bar { padding: 4px 8px; font-size: 10px; }
  .stats-bar { display: none; }
  .input-area { padding: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .input-row { gap: 6px; align-items: flex-end; }
  .input-row textarea {
    min-height: 42px; max-height: 34dvh; padding: 9px 10px;
    font-size: 16px; line-height: 1.35; border-radius: 8px;
  }
  .send-btn { height: 42px; padding: 8px 12px; flex-shrink: 0; font-size: 11px; }
}

body::after {
  content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  opacity: 0.4;
}
</style>
</head>
<body>

<div id="chat-app">
  <div class="chat-topbar">
    <button class="clear-btn" id="media-btn" title="Medien (Videos/Bilder)" style="font-size:15px;">&#x1F39E;&#xFE0F;</button>
    <button class="clear-btn" id="video-create-btn" title="Video erzeugen (direkte Pipeline)" style="font-size:15px;">&#x1F3AC;</button>
    <button class="clear-btn" id="image-create-btn" title="Bild erzeugen (KI-Bild)" style="font-size:15px;">&#x1F3A8;</button>
    <div class="agent-avatar" id="agent-avatar">A</div>
    <span class="agent-name" id="agent-name">Agent</span>
    <span class="agent-sub" id="agent-sub"></span>
    <span class="token-count" id="token-count"></span>
    <select id="convo-select" style="background:var(--bg-input);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:10px;padding:2px 6px;border-radius:4px;max-width:180px;cursor:pointer;"></select>
    <button class="clear-btn" id="convo-new" title="Neue Conversation" style="font-size:12px;">+</button>
    <div class="status-dot" id="status-dot"></div>
    <button class="clear-btn notification-btn" id="notification-btn" title="Notifications" style="font-size:14px;">&#x1F514;<span class="notification-count" id="notification-count">0</span></button>
    <button class="clear-btn" id="files-btn" title="Datei-Explorer" style="font-size:15px;">&#x1F4C1;</button>
    <button class="clear-btn" id="clear-btn" title="Conversation loeschen">&#x1F5D1;</button>
  </div>
  <div id="notification-panel" class="panel">
    <div class="panel-head">
      <span class="panel-title">Notifications</span>
      <button class="clear-btn" id="notifications-refresh" style="font-size:10px; padding:2px 6px;">&#x21BB;</button>
    </div>
    <div id="notification-list" class="notification-list"></div>
  </div>
  <div id="media-panel" class="panel">
    <div class="panel-head">
      <span class="panel-title">Medien — zuletzt erstellt</span>
      <button class="clear-btn" id="media-refresh" style="font-size:10px; padding:2px 6px;">&#x21BB;</button>
    </div>
    <div id="media-list" style="max-height:46dvh;overflow:auto;"></div>
  </div>
  <div id="file-panel" class="panel" style="max-height:250px;">
    <div class="panel-head">
      <span class="panel-title">Home-Verzeichnis</span>
      <div style="display:flex;gap:4px;">
        <button class="clear-btn" id="files-delete-all" style="font-size:10px; padding:2px 6px; color:var(--red);" title="Alle Dateien loeschen">&#x1F5D1; Alle</button>
        <button class="clear-btn" id="files-refresh" style="font-size:10px; padding:2px 6px;">&#x21BB;</button>
      </div>
    </div>
    <div id="file-tree" style="padding:4px 8px;"></div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chat-status-bar" id="status-bar"><div class="spinner"></div><span id="status-text">Generating...</span></div>
  <div class="stats-bar">
    <span>prompt: <span class="sv" id="s-prompt">-</span></span>
    <span>|</span>
    <span>eval: <span class="sv" id="s-eval">-</span></span>
    <span>|</span>
    <span>total: <span class="sv" id="s-total">-</span></span>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="Nachricht eingeben..." rows="1"></textarea>
      <button class="send-btn" id="send-btn">Senden</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ═══ STATE ═══ */
var modulId = '';
var modulConfig = null;
var chatHistory = [];
var streaming = false;
var currentConvoId = '';
var notificationPoll = null;
var lastConvoRefreshNotificationId = '';

var TOKEN_PARAM = new URLSearchParams(window.location.search).get('token');
if (TOKEN_PARAM) {
  localStorage.setItem('api_auth_token', TOKEN_PARAM);
  history.replaceState(null, '', window.location.pathname + window.location.hash);
}

function authHeaders(extra) {
  var headers = extra || {};
  var token = localStorage.getItem('api_auth_token') || '';
  if (token) headers.Authorization = 'Bearer ' + token;
  return headers;
}

function apiFetch(path, opts) {
  opts = opts || {};
  opts.headers = authHeaders(opts.headers || {});
  return fetch(path, opts).then(function(res) {
    if (res.status === 401) throw new Error('HTTP 401: Admin token fehlt oder ist falsch. Chat mit ?token=... oeffnen.');
    return res;
  });
}

/* ═══ Conversations ═══ */
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

function isTransientNetworkErrorMessage(m) {
  if (!m || m.role !== 'assistant') return false;
  var content = String(m.content || '').trim().toLowerCase();
  return content === 'error: network error'
    || content === 'error: failed to fetch'
    || content.indexOf('verbindung abgebrochen:') === 0;
}

function normalizeChatMessages(messages) {
  return (messages || []).filter(function(m) { return !isTransientNetworkErrorMessage(m); });
}

function loadConvoList() {
  if (!modulId) return;
  apiFetch('/api/convos/' + modulId).then(function(r) { return r.json(); }).then(function(data) {
    var sel = ge('convo-select');
    sel.innerHTML = '';
    (data.conversations || []).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id;
      var label = (c.title || 'Conversation').substring(0, 25);
      var msgs = (c.messages || []).length;
      opt.textContent = label + ' (' + msgs + ')';
      sel.appendChild(opt);
    });
    if (currentConvoId) sel.value = currentConvoId;
  });
}

function loadConvo(id) {
  if (!id || !modulId) return;
  apiFetch('/api/convos/' + modulId + '/' + id).then(function(r) { return r.json(); }).then(function(c) {
    if (c.error) return;
    currentConvoId = c.id;
    chatHistory = normalizeChatMessages(c.messages);
    ge('messages').innerHTML = '';
    var name = modulConfig ? ((modulConfig.identity && modulConfig.identity.bot_name) || modulConfig.display_name) : 'Agent';
    chatHistory.forEach(function(m) { appendMsg(m.role, m.content, name); });
    estimateTokens();
    loadNotifications(false);
  });
}

function saveConvo() {
  if (!currentConvoId || !modulId || chatHistory.length === 0) return;
  chatHistory = normalizeChatMessages(chatHistory);
  var title = '';
  for (var i = 0; i < chatHistory.length; i++) {
    if (chatHistory[i].role === 'user') { title = chatHistory[i].content.substring(0, 40); break; }
  }
  var convo = {
    id: currentConvoId,
    title: title || 'Neue Conversation',
    messages: chatHistory,
    updated: new Date().toISOString(),
  };
  apiFetch('/api/convos/' + modulId + '/' + currentConvoId, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(convo)
  });
}

function newConvo() {
  currentConvoId = genId();
  chatHistory = [];
  ge('messages').innerHTML = '';
  ge('token-count').textContent = '';
  if (modulConfig && modulConfig.identity && modulConfig.identity.greeting) {
    var name = (modulConfig.identity && modulConfig.identity.bot_name) || modulConfig.display_name;
    appendMsg('assistant', modulConfig.identity.greeting, name);
  }
  // NICHT sofort speichern — erst wenn die erste User-Nachricht kommt
  loadConvoList();
  loadNotifications(false);
}

ge('convo-select').addEventListener('change', function() { loadConvo(this.value); });
ge('convo-new').addEventListener('click', newConvo);

/* ═══ Notifications ═══ */
function notificationsPath() {
  var path = '/api/notifications/' + modulId + '?include_read=true&limit=50';
  if (currentConvoId) path += '&convo_id=' + encodeURIComponent(currentConvoId);
  return path;
}

function formatNotificationTime(ts) {
  if (!ts) return '';
  try {
    return new Date(ts * 1000).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch(e) {
    return String(ts);
  }
}

function updateNotificationBadge(unread) {
  var badge = ge('notification-count');
  unread = unread || 0;
  badge.textContent = unread > 99 ? '99+' : String(unread);
  if (unread > 0) badge.classList.add('visible');
  else badge.classList.remove('visible');
}

function loadNotifications(markRead) {
  if (!modulId) return;
  apiFetch(notificationsPath()).then(function(r) { return r.json(); }).then(function(data) {
    var items = data.notifications || [];
    renderNotifications(items);
    updateNotificationBadge(data.unread || 0);
    maybeRefreshConvoFromNotifications(items);
    if (markRead) {
      var unreadIds = items.filter(function(n) { return !n.read; }).map(function(n) { return n.id; });
      if (unreadIds.length) {
        Promise.all(unreadIds.map(function(id) { return markNotificationRead(id); }))
          .then(function() { loadNotifications(false); })
          .catch(function() {});
      }
    }
  }).catch(function() {});
}

function maybeRefreshConvoFromNotifications(items) {
  if (streaming || !currentConvoId) return;
  for (var i = 0; i < items.length; i++) {
    var n = items[i];
    if (n.read || n.convo_id !== currentConvoId) continue;
    if ((n.source || '').indexOf('task:') !== 0 && n.title !== 'Aufgabe fertig') continue;
    if (n.id === lastConvoRefreshNotificationId) return;
    lastConvoRefreshNotificationId = n.id;
    loadConvo(currentConvoId);
    return;
  }
}

function renderNotifications(items) {
  var list = ge('notification-list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="notification-empty">Keine Notifications</div>';
    return;
  }
  items.forEach(function(n) {
    var item = document.createElement('div');
    item.className = 'notification-item' + (n.read ? '' : ' unread');

    var top = document.createElement('div');
    top.className = 'notification-top';
    var title = document.createElement('div');
    title.className = 'notification-title';
    title.textContent = n.title || n.kind || 'Notification';
    var actions = document.createElement('div');
    actions.className = 'notification-actions';
    var time = document.createElement('span');
    time.className = 'notification-time';
    time.textContent = formatNotificationTime(n.created_ts);
    var del = document.createElement('button');
    del.className = 'clear-btn';
    del.style.cssText = 'font-size:10px;padding:1px 6px;color:var(--red);margin-left:0;';
    del.title = 'Notification loeschen';
    del.textContent = '×';
    del.addEventListener('click', function(ev) {
      ev.stopPropagation();
      deleteNotification(n.id);
    });
    actions.appendChild(time);
    actions.appendChild(del);
    top.appendChild(title);
    top.appendChild(actions);

    var body = document.createElement('div');
    body.className = 'notification-body';

/* ═══ UTILS ═══ */
function ge(id) { return document.getElementById(id); }
function esc(s) { var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

function renderMd(text) {
  if (!text) return '';
  var toolMatch = text.match(/<tool>(.*?)<\/tool>/);
  var toolHtml = '';
  if (toolMatch) toolHtml = '<div style="color:var(--cyan);font-size:11px;padding:4px 8px;margin:4px 0;border-left:2px solid var(--cyan);background:rgba(0,238,255,0.05);">Tool: ' + esc(toolMatch[1]) + '</div>';
  var clean = text.replace(/<tool>[\s\S]*?<\/tool>/g, '').trim();
  var safe = esc(clean);
  safe = safe.replace(/```[\w]*\n([\s\S]*?)```/g, function(_, c) { return '<pre><code>' + c + '</code></pre>'; });
  safe = safe.replace(/```([\s\S]*?)```/g, function(_, c) { return '<pre><code>' + c + '</code></pre>'; });
  safe = safe.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  var parts = safe.split(/(<pre>[\s\S]*?<\/pre>)/g);
  for (var i = 0; i < parts.length; i++) { if (!parts[i].startsWith('<pre>')) parts[i] = parts[i].replace(/\n/g, '<br>'); }
  return toolHtml + parts.join('');
}

function estimateTokens() {
  var c = 0; chatHistory.forEach(function(m) { c += (m.content || '').length; });
  var est = Math.round(c / 4);
  ge('token-count').textContent = est > 0 ? ('~' + est + ' tok') : '';
}

function appendStream(name) {

  var div = document.createElement('div'); div.className = 'msg assistant';

/* ═══ SEND ═══ */
function send() {
  if (streaming || !modulId) return;
  var input = ge('input');
  var text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';

  var agentName = modulConfig ? ((modulConfig.identity && modulConfig.identity.bot_name) || modulConfig.display_name) : 'Agent';
  if (!currentConvoId) newConvo();
  chatHistory.push({ role: 'user', content: text });
  appendMsg('user', text);
  estimateTokens();
  saveConvo();

  streaming = true;
  ge('send-btn').disabled = true; ge('send-btn').textContent = '...';
  setStatus('Generating...');

  var streamDiv = appendStream(agentName);
  var streamText = streamDiv.querySelector('.stream-text');
  var cursor = streamDiv.querySelector('.typing-cursor');
  var fullContent = '';

  apiFetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ modul: modulId, convo_id: currentConvoId, messages: chatHistory })
  }).then(function(res) {
    if (!res.ok) return res.json().catch(function() { return { error: 'HTTP ' + res.status }; }).then(function(e) { throw new Error(e.error || 'HTTP ' + res.status); });
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    function read() {
      return reader.read().then(function(chunk) {
        if (chunk.done) { if (buffer.trim()) tryParse(buffer.trim()); return; }
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split('\n'); buffer = lines.pop();
        for (var i = 0; i < lines.length; i++) { var l = lines[i].trim(); if (l) tryParse(l); }
        return read();
      });
    }

    function tryParse(line) {
      try {
        var obj = JSON.parse(line);
        if (obj.type === 'status') {
          setStatus(obj.message);
          return;
        }
        if (obj.message && obj.message.content) {
          fullContent += obj.message.content;
          streamText.innerHTML = renderMd(fullContent);
          ge('messages').scrollTop = ge('messages').scrollHeight;
        }
        if (obj.done) {
          if (obj.eval_count && obj.eval_duration) ge('s-eval').textContent = obj.eval_count + ' tok, ' + (obj.eval_count / (obj.eval_duration / 1e9)).toFixed(1) + ' tok/s';
          if (obj.prompt_eval_count && obj.prompt_eval_duration) ge('s-prompt').textContent = obj.prompt_eval_count + ' tok';
          if (obj.total_duration) ge('s-total').textContent = (obj.total_duration / 1e9).toFixed(1) + 's';
          setStatus(null);
        }
      } catch(e) {}
    }

    return read();
  }).then(function() {
    if (cursor && cursor.parentNode) cursor.parentNode.removeChild(cursor);
    if (!fullContent || !fullContent.trim()) {
      fullContent = '(Antwort war leer — Aufgaben im Board pruefen)';
      streamText.innerHTML = '<span style="color:var(--orange);">' + fullContent + '</span>';
    }
    chatHistory.push({ role: 'assistant', content: fullContent });
    estimateTokens();
    saveConvo();
    loadConvoList();
  }).catch(function(e) {
    if (cursor && cursor.parentNode) cursor.parentNode.removeChild(cursor);
    var errMsg = e.message || 'Unbekannter Fehler';
    streamText.innerHTML = '<span style="color:var(--red)">Verbindung abgebrochen: ' + esc(errMsg) + '</span>';
    if (currentConvoId) {
      setTimeout(function() { loadConvo(currentConvoId); }, 1500);
    }
  }).finally(function() {
    streaming = false;
    ge('send-btn').disabled = false; ge('send-btn').textContent = 'Senden';
    setStatus(null);
    loadNotifications(false);
  });
}

function setStatus(text) {
  var el = ge('status-bar');
  if (text) { ge('status-text').textContent = text; el.classList.add('visible'); }
  else { el.classList.remove('visible'); }
}

function renderTree(files, depth) {
  var html = '';
  var indent = depth * 16;
  files.forEach(function(f) {
    if (f.type === 'dir') {
      html += '<div style="padding:2px 4px 2px ' + indent + 'px; color:var(--cyan);">&#x1F4C1; ' + esc(f.name) + '</div>';
      if (f.children && f.children.length > 0) {
        html += renderTree(f.children, depth + 1);
      }
    } else {
      var sizeStr = f.size < 1024 ? f.size + 'B' : (f.size / 1024).toFixed(1) + 'KB';
      html += '<div class="file-entry" style="padding:2px 4px 2px ' + indent + 'px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-radius:3px;" '
        + 'onmouseover="this.style.background=\'rgba(0,238,255,0.06)\'" onmouseout="this.style.background=\'none\'">'
        + '<span onclick="openFile(\'' + esc(f.path).replace(/'/g, "\\'") + '\')" style="flex:1;">&#x1F4C4; ' + esc(f.name) + '</span>'
        + '<span style="color:var(--text-dim); font-size:9px; margin-right:6px;">' + sizeStr + '</span>'
        + '<span onclick="event.stopPropagation();deleteFile(\'' + esc(f.path).replace(/'/g, "\\'") + '\')" style="color:var(--red);cursor:pointer;font-size:10px;" title="Loeschen">&#x2716;</span>'
        + '</div>';
    }
  });
  return html;
}

  var p = ge('media-panel');
  var open = p.style.display === 'block';
  p.style.display = open ? 'none' : 'block';
  if (!open) loadMedia();
});
ge('media-refresh').addEventListener('click', loadMedia);

function fmtBytes(n) {
  if (n > 1e9) return (n / 1e9).toFixed(1) + ' GB';
  if (n > 1e6) return (n / 1e6).toFixed(1) + ' MB';
  return Math.round(n / 1e3) + ' KB';
}

function fmtDate(ts) {
  var d = new Date(ts * 1000);
  return d.toLocaleDateString('de-DE', {day: '2-digit', month: '2-digit', year: 'numeric'});
}

function fmtTime(ts) {
  var d = new Date(ts * 1000);
  return d.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
}

function loadMedia() {
  var list = ge('media-list');
  list.innerHTML = '<div style="padding:10px;color:var(--text-dim);font-size:11px;">lade…</div>';
  apiFetch('/api/media/' + modulId).then(function(r) { return r.json(); }).then(function(data) {
    var items = (data && data.media) || [];
    if (!items.length) {
      list.innerHTML = '<div style="padding:10px;color:var(--text-dim);font-size:11px;">Noch keine Medien.</div>';
      return;
    }
    var html = '';
    var lastDay = '';
    items.forEach(function(m) {
      var day = fmtDate(m.mtime);
      if (day !== lastDay) {
        html += '<div style="padding:6px 10px 2px;color:var(--cyan);font-size:9px;text-transform:uppercase;letter-spacing:1px;">' + day + '</div>';
        lastDay = day;
      }
      var icon = m.kind === 'video' ? '&#x1F3AC;' : (m.kind === 'audio' ? '&#x1F50A;' : '&#x1F5BC;&#xFE0F;');
      html += '<div class="media-item" data-path="' + esc(m.path) + '" data-kind="' + m.kind + '" '
        + 'style="display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--border);">'
        + '<span style="font-size:15px;">' + icon + '</span>'
        + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text);" title="' + esc(m.path) + '">' + esc(m.name) + '</span>'
        + '<span style="font-size:9px;color:var(--text-dim);white-space:nowrap;">' + fmtTime(m.mtime) + ' · ' + fmtBytes(m.size) + '</span>'
        + '</div>';
    });
    list.innerHTML = html;
    list.querySelectorAll('.media-item').forEach(function(el) {
      el.addEventListener('click', function() {
        previewMedia(el.getAttribute('data-path'), el.getAttribute('data-kind'));
      });
    });
  }).catch(function() {
    list.innerHTML = '<div style="padding:10px;color:var(--red);font-size:11px;">Laden fehlgeschlagen.</div>';
  });
}

function previewMedia(path, kind) {
  // Media-Tags senden keine Auth-Header — Datei als Blob mit Token laden.
  apiFetch(homeFileUrl(path)).then(function(r) { return r.blob(); }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    showMediaModal(path, kind, url);
    setTimeout(function() { URL.revokeObjectURL(url); }, 600000);
  }).catch(function(e) { alert('Laden fehlgeschlagen: ' + e); });
}

function showMediaModal(path, kind, url) {
  var inner;
  if (kind === 'video') {
    inner = '<video controls autoplay style="max-width:86vw;max-height:70vh;border-radius:8px;" src="' + url + '"></video>';
  } else if (kind === 'audio') {
    inner = '<audio controls autoplay style="width:60vw;" src="' + url + '"></audio>';
  } else {
    inner = '<img style="max-width:86vw;max-height:70vh;border-radius:8px;" src="' + url + '">';
  }
  var modal = '<div style="position:fixed;inset:0;z-index:9000;background:rgba(2,2,10,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;" onclick="this.remove()">'
    + '<div onclick="event.stopPropagation()" style="display:flex;flex-direction:column;align-items:center;gap:8px;">'
    + inner
    + '<div style="display:flex;gap:8px;align-items:center;">'
    + '<span style="color:var(--text-dim);font-size:10px;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(path) + '</span>'
    + '<button onclick="downloadFile(\'' + esc(path).replace(/'/g, "\\'") + '\')" style="background:none;border:1px solid var(--cyan);color:var(--cyan);cursor:pointer;border-radius:4px;padding:3px 10px;font-size:10px;font-family:var(--font);">Download</button>'
    + '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;border-radius:4px;padding:3px 10px;font-size:10px;font-family:var(--font);">Schliessen</button>'
    + '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', modal);
}

function homeFileUrl(path) {
  return '/api/home/' + modulId + '/' + encodeURIComponent(path);
}

function downloadFile(path) {
  apiFetch(homeFileUrl(path)).then(function(r) { return r.blob(); }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = path.split('/').pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 30000);
  });
}

function openFile(path) {
  var url = homeFileUrl(path);
  // Text-Dateien im Modal anzeigen, Rest im neuen Tab
  var ext = path.split('.').pop().toLowerCase();
  var textTypes = ['txt','md','html','htm','css','js','json','log','py','rs','toml','yaml','yml','sh','csv','xml'];
  if (textTypes.indexOf(ext) !== -1) {
    apiFetch(url).then(function(r) { return r.text(); }).then(function(text) {
      var pre = '<div style="position:fixed;inset:0;z-index:9000;background:rgba(2,2,10,0.9);display:flex;align-items:center;justify-content:center;" onclick="this.remove()">'
        + '<div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:16px;max-width:90%;max-height:80vh;overflow:auto;min-width:50%;" onclick="event.stopPropagation()">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">'
        + '<span style="color:var(--cyan);font-size:11px;">' + esc(path) + '</span>'
        + '<div style="display:flex;gap:4px;">'
        + '<button onclick="downloadFile(\'' + esc(path).replace(/'/g, "\\'") + '\')" style="background:none;border:1px solid var(--cyan);color:var(--cyan);cursor:pointer;border-radius:4px;padding:2px 8px;font-size:10px;text-decoration:none;font-family:var(--font);">Download</button>'
        + '<a href="' + url + '" target="_blank" style="background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;border-radius:4px;padding:2px 8px;font-size:10px;text-decoration:none;font-family:var(--font);">Oeffnen</a>'
        + '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;border-radius:4px;padding:2px 8px;font-size:10px;font-family:var(--font);">X</button>'
        + '</div></div>'
        + '<pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;font-size:11px;color:var(--text);white-space:pre-wrap;max-height:60vh;overflow:auto;">' + esc(text) + '</pre></div></div>';
      document.body.insertAdjacentHTML('beforeend', pre);
    });
  } else {
    downloadFile(path);
  }
}

ge('clear-btn').addEventListener('click', function() {
  if (!confirm('Conversation loeschen?')) return;
  if (currentConvoId) {
    apiFetch('/api/convos/' + modulId + '/' + currentConvoId, {method: 'DELETE'}).then(function() {
      newConvo();
    });
  } else {
    newConvo();
  }
});
</script>
</body>
</html>
